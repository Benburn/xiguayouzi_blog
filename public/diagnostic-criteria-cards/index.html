<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="超声医学（第2版）诊断标准与鉴别诊断 · 记忆卡片。覆盖诊断公式、相关图片与高特异性超声征象。">
<title>超声诊断标准 &amp; 鉴别诊断 · 记忆卡片</title>
<style>
/* ===== 字体：正文无衬线(字重适中) / 标题衬线 ===== */
:root{
  --sans:"Source Han Sans SC","Noto Sans CJK SC","思源黑体 CN","Source Han Sans CN","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Han Serif SC","Noto Serif CJK SC","思源宋体 CN","Source Han Serif CN","Songti SC","STSong","SimSun",Georgia,"Times New Roman",serif;

  --ink:#14161a;
  --ink2:#3c4149;
  --ink3:#5b626c;
  --muted:#8b929c;
  --line:rgba(19,22,28,.09);
  --line2:rgba(19,22,28,.14);

  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.74);
  --glass-line:rgba(255,255,255,.72);

  --brand:#0a84ff;
  --gold:#a06a12;
  --gold-bg:linear-gradient(180deg,rgba(255,248,229,.92),rgba(253,238,200,.86));
  --gold-line:rgba(198,150,58,.42);

  --fs:16px;
  --r:22px;
  --shadow-s:0 1px 2px rgba(16,24,40,.05),0 2px 8px -2px rgba(16,24,40,.06);
  --shadow-m:0 1px 2px rgba(16,24,40,.05),0 10px 30px -12px rgba(16,24,40,.18);
  --shadow-l:0 18px 60px -18px rgba(16,24,40,.34);
  --ui:var(--sans);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{
  scroll-behavior:smooth;
  /* 苹果风彩色光斑背景（直接放在根元素，作为画布底） */
  background-color:#eef1f6;
  background-image:
    radial-gradient(52vw 48vh at 10% 0%,rgba(214,224,242,.85),transparent 62%),
    radial-gradient(50vw 46vh at 92% 6%,rgba(220,228,244,.80),transparent 60%),
    radial-gradient(58vw 54vh at 88% 98%,rgba(216,232,228,.72),transparent 62%),
    radial-gradient(48vw 48vh at 2% 92%,rgba(226,222,242,.76),transparent 60%),
    linear-gradient(165deg,#f2f5fa 0%,#eaeef6 48%,#eef1f7 100%);
  background-attachment:fixed;
  background-size:auto,auto,auto,auto,auto,auto,cover;
}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:var(--fs);
  font-weight:400;line-height:1.78;letter-spacing:.004em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  background:transparent;
  min-height:100vh;
}

button,input{font:inherit;color:inherit;font-family:var(--sans)}
button{cursor:pointer;border:0;background:none}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:1px solid var(--glass-line);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 24px -18px rgba(16,24,40,.4);
}
.topbar-in{max-width:1320px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(150deg,#2b3440,#0f1319);
  color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.02em;
  box-shadow:0 6px 16px -6px rgba(15,19,25,.7),0 1px 0 rgba(255,255,255,.28) inset;
}
.brand-txt{min-width:0}
.brand-t1{
  font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em;
  white-space:nowrap;line-height:1.3;color:#111418;
}
.brand-t2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{
  height:35px;padding:0 13px;border-radius:11px;
  border:1px solid var(--glass-line);
  background:rgba(255,255,255,.66);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:13px;font-weight:500;color:var(--ink2);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .16s cubic-bezier(.32,.72,0,1),background .16s,box-shadow .16s,border-color .16s;
  box-shadow:0 1px 2px rgba(16,24,40,.05);
}
.btn:hover{background:rgba(255,255,255,.88);border-color:var(--line2)}
.btn:active{transform:scale(.96)}
.btn.on{
  background:linear-gradient(180deg,#2c333d,#171c23);border-color:rgba(255,255,255,.16);
  color:#fff;box-shadow:0 6px 18px -8px rgba(15,19,25,.75),0 1px 0 rgba(255,255,255,.2) inset;
}
.btn.on:hover{background:linear-gradient(180deg,#353d49,#1d232b)}
.btn.icon{padding:0;width:35px;justify-content:center}
.search{
  height:35px;min-width:150px;flex:1 1 150px;max-width:290px;
  border:1px solid var(--glass-line);border-radius:11px;padding:0 13px;
  background:rgba(255,255,255,.68);outline:none;font-size:13.5px;
  transition:box-shadow .18s,border-color .18s,background .18s;
}
.search::placeholder{color:#a2a9b3}
.search:focus{background:#fff;border-color:rgba(10,132,255,.5);box-shadow:0 0 0 4px rgba(10,132,255,.13)}
.fsval{font-size:11.5px;color:var(--muted);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}

/* ================= 筛选 ================= */
.filters{
  position:sticky;top:57px;z-index:55;
  background:rgba(246,248,251,.62);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.6);
}
.filters-in{max-width:1320px;margin:0 auto;padding:10px 20px 9px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:32px;padding:0 14px;border-radius:999px;
  border:1px solid var(--glass-line);background:rgba(255,255,255,.62);
  font-size:12.5px;font-weight:500;color:var(--ink2);
  display:inline-flex;align-items:center;gap:7px;
  transition:transform .16s cubic-bezier(.32,.72,0,1),background .16s,border-color .16s,color .16s;
  box-shadow:0 1px 2px rgba(16,24,40,.045);
}
.chip:hover{background:rgba(255,255,255,.9)}
.chip:active{transform:scale(.96)}
.chip.on{background:linear-gradient(180deg,#2c333d,#171c23);border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(15,19,25,.7)}
.chip .cnt{font-size:10.5px;opacity:.62;font-variant-numeric:tabular-nums;font-weight:600}
.chip-dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.subchips{margin-top:9px;display:none}
.subchips.show{display:block}

/* ================= 主体 ================= */
.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 90px}
.stat{font-size:12.5px;color:var(--muted);margin:0 3px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:.005em}
.stat b{color:var(--ink);font-weight:650}
.training-tip{
  display:none;margin:0 0 14px;padding:10px 15px;border-radius:14px;
  background:var(--gold-bg);border:1px solid var(--gold-line);color:#7a5310;
  font-size:12.5px;font-weight:500;line-height:1.7;
  backdrop-filter:blur(8px);
}
body.training .training-tip{display:block}

.grid{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{
  position:relative;overflow:hidden;
  /* 每张卡带章节色极淡染色 + 玻璃白，形成"苹果玻璃"层次 */
  background:
    rgba(255,255,255,.72); /* 降级 */
    linear-gradient(158deg,
      color-mix(in srgb,var(--rc) 5%,rgba(255,255,255,.86)) 0%,
      color-mix(in srgb,var(--rc) 2%,rgba(255,255,255,.70)) 44%,
      rgba(255,255,255,.66) 100%);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.92);
  border-radius:var(--r);
  padding:15px 16px 13px;
  box-shadow:
    0 1px 2px rgba(16,24,40,.05),
    0 14px 36px -20px rgba(16,24,40,.24),
    0 1px 0 rgba(255,255,255,.95) inset;
  cursor:pointer;display:flex;flex-direction:column;gap:10px;
  transition:transform .22s cubic-bezier(.32,.72,0,1),box-shadow .22s,border-color .22s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--rc),#e9edf3);
  background:linear-gradient(180deg,var(--rc),#e6ebf2); /* 降级 */
  background:linear-gradient(180deg,var(--rc),color-mix(in srgb,var(--rc) 55%,#fff));
  opacity:.92;
}
.card::after{
  content:"";position:absolute;right:-46px;top:-58px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,var(--rc),transparent 70%);
  background:radial-gradient(circle,var(--rc),transparent 70%); /* 降级 */
  background:radial-gradient(circle,color-mix(in srgb,var(--rc) 15%,transparent),transparent 70%);
  opacity:.34;pointer-events:none;transition:opacity .22s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-l),0 1px 0 rgba(255,255,255,.7) inset;border-color:rgba(255,255,255,.95)}
.card:hover::after{opacity:.75}

.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.tag-region{
  background:rgba(255,255,255,.72);
  background:rgba(255,255,255,.6); /* 降级 */
  background:color-mix(in srgb,var(--rc) 14%,rgba(255,255,255,.5));
  color:#2b3138;
  color:var(--rc); /* 降级 */
  color:color-mix(in srgb,var(--rc) 78%,#101216);
  border:1px solid var(--rc);
  border:1px solid rgba(19,22,28,.10); /* 降级 */
  border:1px solid color-mix(in srgb,var(--rc) 22%,transparent);
}
.tag-group{background:rgba(255,255,255,.62);color:var(--ink3);border:1px solid var(--glass-line);font-weight:500}
.tag-page{margin-left:auto;color:#a7aeb8;font-weight:500;font-variant-numeric:tabular-nums}

.card-name{
  font-family:var(--serif);
  font-size:calc(var(--fs) + 3.5px);font-weight:600;line-height:1.34;margin:0;
  letter-spacing:.012em;color:#0f1216;
}
.card-formula{
  font-size:calc(var(--fs) - 3px);line-height:1.66;color:#6d4708;
  background:var(--gold-bg);border:1px solid var(--gold-line);
  border-left:3px solid rgba(198,150,58,.75);
  border-radius:11px;padding:8px 11px;font-weight:450;
  box-shadow:0 1px 2px rgba(160,106,18,.06) inset;
}
.card-specs{display:flex;flex-wrap:wrap;gap:6px}
.spec-chip{
  font-size:11px;font-weight:600;color:#8a5a00;
  background:linear-gradient(180deg,rgba(255,250,235,.95),rgba(253,238,200,.9));
  border:1px solid var(--gold-line);border-radius:8px;padding:3px 8px;
  display:inline-flex;align-items:center;gap:3px;
}
.spec-chip::before{content:"★";font-size:9px;color:#d69e2e}
.card-foot{
  display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);
  margin-top:auto;padding-top:6px;border-top:1px solid rgba(19,22,28,.07);
}
.card-foot .fl{margin-left:auto;display:flex;gap:5px}
.mini-flag{font-size:10px;font-weight:650;padding:2px 7px;border-radius:6px;letter-spacing:.01em}
.mf-spec{background:rgba(253,238,196,.9);color:#8a5a00}
.mf-formula{background:rgba(219,233,254,.9);color:#1d4ed8}
.mf-num{background:rgba(219,243,235,.9);color:#0f766e}
.mf-confuse{background:rgba(253,231,241,.9);color:#a3215c}

/* ================= 训练模式遮罩 ================= */
.t-hide{position:relative}
body.training .t-hide > .t-body{
  filter:blur(9px) saturate(.75);opacity:.42;user-select:none;pointer-events:none;transition:.22s;
}
body.training .t-hide::after{
  content:"点击显示";position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;
  font-size:12px;font-weight:650;color:#8a5a00;letter-spacing:.1em;
  background:rgba(255,252,244,.42);cursor:pointer;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
body.training .t-hide.revealed > .t-body{filter:none;opacity:1;user-select:auto;pointer-events:auto}
body.training .t-hide.revealed::after{display:none}

/* ================= 详情抽屉 ================= */
.mask{
  position:fixed;inset:0;z-index:200;background:rgba(18,22,28,.34);
  opacity:0;pointer-events:none;transition:.26s;
  backdrop-filter:blur(6px) saturate(140%);-webkit-backdrop-filter:blur(6px) saturate(140%);
}
.mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:210;
  transform:translateX(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  background:rgba(246,248,251,.86);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:-30px 0 90px -30px rgba(16,24,40,.45);
  border-left:1px solid var(--glass-line);
}
.drawer.show{transform:translateX(0)}
.dhead{
  position:sticky;top:0;padding:15px 18px 13px;display:flex;align-items:flex-start;gap:12px;
  background:rgba(255,255,255,.6);border-bottom:1px solid var(--glass-line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.dhead-main{min-width:0;flex:1}
.dhead h2{
  font-family:var(--serif);margin:2px 0 7px;font-size:calc(var(--fs) + 7px);
  font-weight:600;line-height:1.28;letter-spacing:.012em;color:#0f1216;
}
.dhead .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dclose{
  width:35px;height:35px;border-radius:50%;flex:none;
  border:1px solid var(--glass-line);background:rgba(255,255,255,.7);
  display:grid;place-items:center;font-size:16px;color:var(--ink2);
  transition:transform .16s,background .16s;
}
.dclose:hover{background:#fff}
.dclose:active{transform:scale(.92)}
.dbody{overflow:auto;padding:18px 18px 70px;flex:1}
.blk{
  background:var(--glass-strong);
  backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--glass-line);border-radius:18px;
  padding:15px 17px;margin-bottom:13px;
  box-shadow:var(--shadow-s),0 1px 0 rgba(255,255,255,.6) inset;
}
.blk-t{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink2);margin:0 0 11px;letter-spacing:.02em}
.blk-t .ic{font-size:14px}
.blk-t .sub{font-weight:500;color:var(--muted);font-size:11px;margin-left:auto}
.blk-formula{
  background:linear-gradient(160deg,rgba(255,252,244,.94),rgba(253,240,206,.9));
  border-color:var(--gold-line);
}
.formula-big{
  font-family:var(--serif);
  font-size:calc(var(--fs) + 1.5px);line-height:1.78;font-weight:600;color:#653c05;
  padding:2px 0;word-break:break-word;letter-spacing:.01em;
}
.formula-big .ar{color:#c08a2e;font-weight:800;margin:0 2px}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.ul li{position:relative;padding-left:20px;font-size:calc(var(--fs) - 1px);line-height:1.76;color:#23272e}
.ul li::before{content:"";position:absolute;left:5px;top:.66em;width:6px;height:6px;border-radius:50%;background:var(--rc,#c3c9d1)}
.ul.num{counter-reset:n}
.ul.num li::before{
  counter-increment:n;content:counter(n);width:17px;height:17px;border-radius:6px;
  background:linear-gradient(180deg,#e9edf3,var(--rc,#aab2bc));
  background:linear-gradient(180deg,var(--rc,#aab2bc),var(--rc,#aab2bc)); /* 降级 */
  background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 92%,#fff),var(--rc,#aab2bc));
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;top:.36em;left:0;
  box-shadow:0 2px 5px -2px var(--rc);
  box-shadow:0 2px 5px -2px rgba(16,24,40,.2); /* 降级 */
  box-shadow:0 2px 5px -2px color-mix(in srgb,var(--rc) 60%,transparent);
}
.spec-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.spec-list li{
  background:var(--gold-bg);border:1px solid var(--gold-line);
  border-left:3px solid rgba(198,150,58,.8);border-radius:11px;padding:9px 12px;
  font-size:calc(var(--fs) - 1px);font-weight:600;color:#7a5310;line-height:1.64;
}
.df-list{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.df-list li{
  background:rgba(255,255,255,.6);border:1px solid var(--glass-line);border-radius:12px;
  padding:10px 13px;font-size:calc(var(--fs) - 1.5px);line-height:1.74;color:#272c33;
}
.df-list li b{color:#8f1d2c}
.mem-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mem-list li{
  background:linear-gradient(180deg,rgba(237,244,255,.9),rgba(226,237,255,.86));
  border:1px solid rgba(150,180,240,.4);border-radius:11px;padding:9px 12px;
  font-size:calc(var(--fs) - 1.5px);font-weight:550;color:#1f4285;line-height:1.66;
}
details.book{margin-top:2px}
details.book > summary{
  cursor:pointer;list-style:none;padding:11px 14px;border-radius:13px;
  background:rgba(255,255,255,.6);border:1px solid var(--glass-line);
  font-size:12.5px;font-weight:600;color:var(--ink2);
  display:flex;align-items:center;gap:8px;
  transition:background .16s,border-color .16s;
}
details.book > summary::-webkit-details-marker{display:none}
details.book > summary:hover{background:rgba(255,255,255,.85)}
details.book[open] > summary{border-radius:13px 13px 0 0;border-bottom-color:transparent;background:rgba(255,255,255,.7)}
details.book > summary .arrow{margin-left:auto;transition:transform .22s;font-size:11px;color:var(--muted)}
details.book[open] > summary .arrow{transform:rotate(90deg)}
.book-inner{
  background:rgba(255,255,255,.62);border:1px solid var(--glass-line);border-top:0;
  border-radius:0 0 13px 13px;padding:13px 16px 5px;
}
.book-sec{margin-bottom:13px}
.book-sec h4{
  margin:0 0 7px;font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.06em;
}
.book-sec p{
  font-family:var(--serif);
  margin:0 0 8px;font-size:calc(var(--fs) - 2.5px);line-height:1.86;color:#4a5058;
}
.empty{color:var(--muted);font-size:12.5px;padding:4px 0}

/* ---- 下一条（滑到底自动跳转）---- */
.next-wrap{margin:18px 0 4px;padding-top:15px;border-top:1px solid rgba(19,22,28,.08)}
.next-hint{
  text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:10px;
  transition:color .2s,opacity .2s;
}
.next-hint.armed{
  color:#1d4ed8;font-weight:600;
  animation:hintPulse 1.4s ease-in-out infinite;
}
@keyframes hintPulse{0%,100%{opacity:.72}50%{opacity:1}}
.next-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-radius:16px;text-align:left;
  background:linear-gradient(158deg,rgba(255,255,255,.9),rgba(255,255,255,.7));
  border:1px solid var(--glass-line);
  box-shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -16px rgba(16,24,40,.28),0 1px 0 rgba(255,255,255,.9) inset;
  transition:transform .18s cubic-bezier(.32,.72,0,1),box-shadow .18s,background .18s;
}
.next-btn:hover{background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 16px 34px -18px rgba(16,24,40,.35)}
.next-btn:active{transform:scale(.985)}
.nb-label{
  flex:none;font-size:11px;font-weight:650;color:#fff;letter-spacing:.06em;
  background:linear-gradient(180deg,#2c333d,#171c23);border-radius:7px;padding:4px 8px;
}
.nb-name{
  font-family:var(--serif);flex:1;min-width:0;font-size:calc(var(--fs) + .5px);font-weight:600;
  color:#12161b;letter-spacing:.012em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nb-arrow{flex:none;font-size:16px;color:var(--muted)}
details.book + .next-wrap{margin-top:16px}

.totop{
  position:fixed;right:20px;bottom:24px;width:46px;height:46px;border-radius:15px;z-index:80;
  display:none;place-items:center;font-size:17px;color:var(--ink2);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow-l);
  transition:transform .16s,background .16s;
}
.totop.show{display:grid}
.totop:hover{background:rgba(255,255,255,.94)}
.totop:active{transform:scale(.94)}

/* ================= 平板 ================= */
@media (max-width:900px){
  .brand-t2{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
}
/* ================= 手机 ================= */
@media (max-width:640px){
  :root{--r:19px}
  .topbar-in{padding:10px 14px;gap:9px}
  .brand-t1{font-size:15px}
  .filters{top:55px}
  .filters-in{padding:9px 14px 8px}
  .wrap{padding:15px 14px 84px}
  .grid{grid-template-columns:1fr;gap:12px}
  .search{max-width:none;flex:1 1 100%;order:9}
  .card{padding:14px 14px 12px}
  .drawer{width:100%;top:auto;height:94%;border-radius:24px 24px 0 0;transform:translateY(102%);border-left:0;border-top:1px solid var(--glass-line)}
  .drawer.show{transform:translateY(0)}
  .dbody{padding:15px 15px 60px}
  .dhead{padding:14px 15px 12px;border-radius:24px 24px 0 0}
  .totop{right:14px;bottom:16px}
}
@media print{.topbar,.filters,.totop,.mask,.drawer{display:none!important}}

/* 封面 */
/* ================= 封面（磨砂图片 + 西瓜柚子） ================= */
.splash{
  position:fixed;inset:0;z-index:9990;overflow:hidden;cursor:pointer;
  display:grid;place-items:center;
  transition:opacity .5s cubic-bezier(.32,.72,0,1),transform .5s cubic-bezier(.32,.72,0,1);
  -webkit-tap-highlight-color:transparent;
}
.splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.splash[hidden]{display:none}

/* 底图：超声探头图，轻微模糊保留轮廓 */
.splash-bg{
  position:absolute;inset:-6%;
  background-image:var(--splash-img);
  background-size:cover;background-position:center 44%;
  filter:blur(1.5px) saturate(118%) contrast(104%);
  transform:scale(1.05);
}
/* 磨砂玻璃层：细腻雾面，但保留底图层次 */
.splash-frost{
  position:absolute;inset:0;
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  background:
    radial-gradient(72% 52% at 50% 46%,rgba(255,255,255,.42) 0%,rgba(255,255,255,.10) 60%,transparent 100%),
    linear-gradient(168deg,
      rgba(255,255,255,.28) 0%,
      rgba(244,248,253,.18) 42%,
      rgba(230,239,250,.32) 100%);
}
/* 四角暗角，聚焦中心 */
.splash-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(118% 86% at 50% 46%,rgba(255,255,255,.06) 30%,rgba(30,44,64,.20) 100%),
    linear-gradient(180deg,rgba(255,255,255,.10),transparent 26%,transparent 72%,rgba(255,255,255,.08));
}

.splash-inner{
  position:relative;text-align:center;padding:0 26px;
  animation:splashIn .9s cubic-bezier(.22,.9,.28,1) both;
}
@keyframes splashIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.splash-name{
  font-family:var(--serif);
  font-size:clamp(46px,13vw,84px);
  font-weight:600;letter-spacing:.16em;margin:0 0 14px;
  color:#141b26;text-indent:.16em;
  text-shadow:0 1px 0 rgba(255,255,255,.85),0 12px 34px rgba(28,40,58,.20);
}
.splash-sub{

/* ================= 图组（诊断公式下方） ================= */
.figs{margin-bottom:13px}
.figs-head{
  display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;
  color:var(--ink2);margin:0 0 10px;letter-spacing:.02em;
}
.figs-head .ic{font-size:14px}
.figs-head .sub{font-weight:500;color:var(--muted);font-size:11px;margin-left:auto}

.figgroup{
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);
  border:1px solid var(--glass-line);border-radius:16px;
  padding:12px 13px;margin-bottom:11px;
  box-shadow:var(--shadow-s),0 1px 0 rgba(255,255,255,.6) inset;
}
.figgroup:last-child{margin-bottom:0}

/* 图片栅格：按张数自适应 */
.figgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.figgrid.n1{grid-template-columns:1fr}
.figgrid.n2{grid-template-columns:1fr 1fr}
.figgrid.n3{grid-template-columns:repeat(3,1fr)}
.figgrid.n4{grid-template-columns:repeat(2,1fr)}

.figitem{
  position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;
  border-radius:11px;overflow:hidden;
  border:1px solid rgba(19,22,28,.10);
  background:linear-gradient(180deg,#f7f8fa,#eff1f4);
  transition:transform .18s cubic-bezier(.32,.72,0,1),box-shadow .18s;
}
.figitem:hover{transform:translateY(-1px);box-shadow:0 8px 22px -12px rgba(16,24,40,.4)}
.figitem:active{transform:scale(.99)}
.figitem img{
  display:block;width:100%;height:auto;
  aspect-ratio:4/3;object-fit:contain;
  background:#f4f6f8;
  opacity:0;transition:opacity .3s;
}
.figitem img.loaded{opacity:1}
.figitem::after{
  content:"🔍";position:absolute;right:7px;bottom:7px;width:24px;height:24px;border-radius:8px;
  display:grid;place-items:center;font-size:11px;
  background:rgba(22,28,38,.55);color:#fff;backdrop-filter:blur(4px);
  opacity:0;transition:opacity .18s;
}
.figitem:hover::after{opacity:1}
.figitem .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;color:var(--muted);letter-spacing:.08em;
}

.figlegend{
  margin:9px 2px 0;font-size:11.5px;line-height:1.7;color:var(--ink3);
}
.figlegend b{color:#1c2128;font-weight:650}
.figlegend .fig-no{
  display:inline-block;font-weight:650;color:#1d4ed8;background:rgba(219,233,254,.85);
  border-radius:5px;padding:1px 6px;margin-right:6px;font-size:11px;
}
.figlegend .fig-detail{display:block;margin-top:4px;color:var(--muted);font-size:11px}

/* ================= 图片放大查看器 ================= */
.lb{
  position:fixed;inset:0;z-index:400;display:grid;place-items:center;
  background:rgba(12,16,22,.86);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .24s;
}

}
.lb-imgwrap{
  position:relative;overflow:hidden;border-radius:12px;

}

}
.lb-cap .fig-no{

}
.lb-cap .d{display:block;margin-top:4px;color:rgba(255,255,255,.62);font-size:11.5px}
.lb-tools{
  position:absolute;top:-46px;right:0;display:flex;gap:8px;
}
.lb-btn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;font-size:15px;
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);
  transition:background .16s,transform .16s;
}
.lb-btn:hover{background:rgba(255,255,255,.26)}
.lb-btn:active{transform:scale(.94)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;font-size:19px;
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);
}
.lb-nav:hover{background:rgba(255,255,255,.26)}
.lb-nav.prev{left:-58px}
.lb-nav.next{right:-58px}
.lb-count{
  position:absolute;top:-42px;left:0;color:rgba(255,255,255,.72);font-size:12px;
  font-variant-numeric:tabular-nums;
}
.lb-hint{
  position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.5);font-size:11.5px;white-space:nowrap;
}

@media (max-width:900px){
  .lb-nav.prev{left:6px}
  .lb-nav.next{right:6px}

}
@media (max-width:640px){

  .figgrid.n3,.figgrid.n4{grid-template-columns:repeat(2,1fr)}
  .figgroup{padding:11px 11px}
  .lb-tools{top:-44px}
  .lb-hint{display:none}
}

tps://xiguayouzi.cc.cd/ultrasound-medicine-2e/ocr_output/imgs/img_in_image_box_101_516_549_861.jpg"]}]},{"name":"脂肪瘤","region":"肌骨","group":"肌骨","section":"第六节 肌肉骨骼系统相关常见软组织肿物","page":531,"formula":"脂肪层内等/高回声病变+内部条索样强回声分隔走行与皮肤一致+内无血流信号 → 脂肪瘤","specificSigns":[],"flags":["易混淆"],"figs":[{"fig":"20-6-2","legend":"脂肪瘤声像图","detail":"","imgs":["https://xiguayouzi.cc.cd/ultrasound-medicine-2e/ocr_output/imgs/img_in_image_box_567_514_1014_861.jpg"]}]},{"name":"血管瘤（血管畸形）","region":"肌骨","group":"肌骨","section":"第六节 肌肉骨骼系统相关常见软组织肿物","page":531,"formula":"边界不清混合回声区+多发网格样低至无回声+探头加压瘤体明显压缩 → 血管瘤（血管畸形）","specificSigns":["静脉石"],"flags":["高特异","易混淆"],"figs":[{"fig":"20-6-3","legend":"血管瘤声像图","detail":"","imgs":["https://xiguayouzi.cc.cd/ultrasound-medicine-2e/ocr_output/imgs/img_in_image_box_581_1054_995_1415.jpg"]}]},{"name":"神经来源肿瘤","region":"肌骨","group":"肌骨","section":"第六节 肌肉骨骼系统相关常见软组织肿物","page":532,"formula":"按压肿物后放射性疼痛+边界清楚的低回声病变+瘤体一侧或两侧可见与神经相延续 → 神经来源肿瘤","specificSigns":[],"flags":["高特异","易混淆"],"figs":[{"fig":"20-6-4","legend":"神经纤维瘤声像图","detail":"","imgs":["https://xiguayouzi.cc.cd/ultrasound-medicine-2e/ocr_output/imgs/img_in_image_box_576_115_1023_389.jpg"]}]}]</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('app-data').textContent);
  // 每次打开随机顺序
  DATA.forEach(function(d){ d._r = Math.random(); });

  // ---- 大区配色 ----
  var REGION_COLOR = {
    "心脏":"#d92d3f","胸部":"#8b5cf6","腹部":"#d97706","泌尿":"#0891b2","腹膜后":"#7c3aed",
    "妇产":"#db2777","产科":"#e11d48","外周血管":"#0d9488","浅表":"#2563eb","肌骨":"#65a30d"
  };
  var REGION_ORDER = ["心脏","胸部","腹部","泌尿","腹膜后","妇产","产科","外周血管","浅表","肌骨"];

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function color(r){return REGION_COLOR[r]||'#8b94a0';}

  // ---- 状态 ----
  var state = {region:'全部', group:'全部', q:'', training:false};

  // localStorage 容错
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  // ---- 字号 ----
  var fs = parseInt(lsGet('us_fs')||'16',10);
  if(isNaN(fs)||fs<13||fs>23) fs=16;
  function applyFs(){
    document.documentElement.style.setProperty('--fs', fs+'px');
    document.getElementById('fsVal').textContent = fs;
    lsSet('us_fs', fs);
  }
  document.getElementById('fsUp').onclick=function(){ if(fs<23){fs++;applyFs();} };
  document.getElementById('fsDown').onclick=function(){ if(fs>13){fs--;applyFs();} };

  // ---- 训练模式 ----
  function applyTraining(){
    document.body.classList.toggle('training', state.training);
    document.getElementById('trainBtn').classList.toggle('on', state.training);
    lsSet('us_train', state.training?'1':'0');
    // 关闭时清掉已揭晓状态
    if(!state.training){
      [].forEach.call(document.querySelectorAll('.t-hide.revealed'),function(el){el.classList.remove('revealed');});
    }
  }
  document.getElementById('trainBtn').onclick=function(){
    state.training=!state.training; applyTraining(); render();
    var open=document.querySelector('.drawer.show');
    if(open && currentDetail) openDetail(currentDetail); // 详情重渲染以应用/取消遮罩
  };

  // ---- 过滤 ----
  function inFilter(d){
    if(state.region!=='全部' && d.region!==state.region) return false;
    if(state.group!=='全部' && d.group!==state.group) return false;
    if(state.q){
      var q=state.q.toLowerCase();
      var hay=[d.name,d.region,d.group,d.section,d.formula,(d.specificSigns||[]).join(' ')].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  }
  function filtered(){ return DATA.filter(inFilter).slice().sort(function(a,b){return a._r-b._r;}); }

  // ---- 大区 chips ----
  function renderRegionChips(){
    var counts={}; DATA.forEach(function(d){counts[d.region]=(counts[d.region]||0)+1;});
    var box=document.getElementById('regionChips');
    var html='<button class="chip'+(state.region==='全部'?' on':'')+'" data-r="全部">全部 <span class="cnt">'+DATA.length+'</span></button>';
    REGION_ORDER.forEach(function(r){
      if(!counts[r]) return;
      html+='<button class="chip'+(state.region===r?' on':'')+'" data-r="'+esc(r)+'">'+
        '<span class="chip-dot" style="background:'+color(r)+'"></span>'+esc(r)+
        ' <span class="cnt">'+counts[r]+'</span></button>';
    });
    box.innerHTML=html;
    [].forEach.call(box.querySelectorAll('.chip'),function(b){
      b.onclick=function(){
        state.region=b.dataset.r; state.group='全部';
        renderRegionChips(); renderGroupChips(); render();
      };
    });
  }

  // ---- 分组 chips（仅选中大区后出现） ----
  function renderGroupChips(){
    var box=document.getElementById('groupChips');
    if(state.region==='全部'){ box.className='chips subchips'; box.innerHTML=''; return; }
    var pool=DATA.filter(function(d){return d.region===state.region;});
    var g={}; pool.forEach(function(d){g[d.group]=(g[d.group]||0)+1;});
    var keys=Object.keys(g).sort(function(a,b){return g[b]-g[a];});
    var html='<button class="chip'+(state.group==='全部'?' on':'')+'" data-g="全部">全部 '+pool.length+'</button>';
    keys.forEach(function(k){
      html+='<button class="chip'+(state.group===k?' on':'')+'" data-g="'+esc(k)+'">'+esc(k)+' <span class="cnt">'+g[k]+'</span></button>';
    });
    box.className='chips subchips show';
    box.innerHTML=html;
    [].forEach.call(box.querySelectorAll('.chip'),function(b){
      b.onclick=function(){ state.group=b.dataset.g; renderGroupChips(); render(); };
    });
  }

  // ---- 训练遮罩包装 ----
  function maskable(cls, inner){
    if(!state.training) return inner;
    return '<div class="t-hide '+cls+'"><div class="t-body">'+inner+'</div></div>';
  }

  // ---- 卡片 ----
  function flagsHtml(f){
    f=f||[]; var h='';
    if(f.indexOf('高特异')>=0) h+='<span class="mini-flag mf-spec">高特异</span>';
    if(f.indexOf('公式强')>=0) h+='<span class="mini-flag mf-formula">公式强</span>';
    if(f.indexOf('数值')>=0) h+='<span class="mini-flag mf-num">数值</span>';
    if(f.indexOf('易混淆')>=0) h+='<span class="mini-flag mf-confuse">易混淆</span>';
    return h;
  }
  function cardHtml(d,idx){
    var c=color(d.region);
    var specs=(d.specificSigns||[]).slice(0,3).map(function(s){return '<span class="spec-chip">'+esc(s)+'</span>';}).join('');
    var more=(d.specificSigns||[]).length>3?'<span class="spec-chip">+'+((d.specificSigns.length)-3)+'</span>':'';
    var formula=d.formula?('<div class="card-formula">'+esc(d.formula)+'</div>'):'';
    var formulaMasked=maskable('t-formula', formula);
    var specsMasked=(specs||more)?maskable('t-spec','<div class="card-specs">'+specs+more+'</div>'):'';
    return '<article class="card" style="--rc:'+c+'" data-idx="'+idx+'">'+
      '<h3 class="card-name">'+esc(d.name)+'</h3>'+
      formulaMasked + specsMasked +
      '</article>';
  }

  function render(){
    var list=filtered();
    document.getElementById('grid').innerHTML = list.map(function(d,i){return cardHtml(d,i);}).join('') ||
      '<div class="empty" style="grid-column:1/-1;padding:40px 0;text-align:center">没有匹配的条目，试试其它关键词或分类。</div>';
    var specN=list.filter(function(d){return (d.flags||[]).indexOf('高特异')>=0;}).length;
    document.getElementById('stat').innerHTML =
      '共 <b>'+list.length+'</b> 个疾病条目'+
      (state.region!=='全部'?(' · <b>'+esc(state.region)+'</b>'):'')+
      (state.group!=='全部'?(' · <b>'+esc(state.group)+'</b>'):'')+
      ' · 其中高特异性征象 <b>'+specN+'</b> 条 · 点卡片查看详情';
    bindCards(list);
  }

  function bindCards(list){
    [].forEach.call(document.querySelectorAll('.card'),function(el){
      el.onclick=function(){ openDetailAt(list, Number(el.dataset.idx)); };
    });
    // 训练模式：点击遮罩揭晓；已揭晓后不再拦截，让点击穿透到卡片打开详情
    [].forEach.call(document.querySelectorAll('.t-hide'),function(el){
      el.addEventListener('click',function(ev){
        if(!state.training) return;
        if(el.classList.contains('revealed')) return;
        ev.stopPropagation();
        el.classList.add('revealed');
      });
    });
  }

  // ---- 详情 ----
  var currentDetail=null;
  var currentList=[], currentIdx=-1;
  var armed=false;        // 已滑到底、进入“待触发”状态
  var armedAtTop=false;   // 待触发时是否已回弹到顶
  var armTimer=null;

  function openDetailAt(list, idx){
    currentList=list||[]; currentIdx=idx;
    armed=false; armedAtTop=false;
    openDetail(currentList[idx]);
  }
  function goNext(){
    if(!currentList.length) return;
    currentIdx=(currentIdx+1)%currentList.length;
    armed=false; armedAtTop=false;
    openDetail(currentList[currentIdx]);
    document.getElementById('dBody').scrollTop=0;
  }
  function setHint(text,on){
    var el=document.getElementById('nextHint');
    if(!el) return;
    el.textContent=text;
    el.classList.toggle('armed',!!on);
  }
  // 滑到底先“上膛”，松手并回弹后，再往下滑一次才跳 —— 避免到底即跳的突兀感
  var _snOnScroll=null,_snOnTouchStart=null,_snOnTouchMove=null,_snOnWheel=null;
  function bindScrollNext(){
    var body=document.getElementById('dBody');
    if(!body) return;
    // 先移除上一轮绑定，避免叠加
    if(_snOnScroll){
      body.removeEventListener('scroll',_snOnScroll);
      body.removeEventListener('touchstart',_snOnTouchStart);
      body.removeEventListener('touchmove',_snOnTouchMove);
      body.removeEventListener('wheel',_snOnWheel);
    }
    var lastTop=0, touchStart=0;
    function atBottom(){ return body.scrollHeight-body.scrollTop-body.clientHeight <= 2; }

    _snOnScroll=function(){
      if(!currentList.length) return;
      var top=body.scrollTop;
      lastTop=top;
      if(atBottom()){
        if(!armed){
          armed=true; armedAtTop=false;
          setHint('已到底部 · 再往下滑一次进入下一条',true);
          clearTimeout(armTimer);
          armTimer=setTimeout(function(){ armedAtTop=true; },380);
        }
        return;
      }
      if(armed && top < body.scrollHeight-body.clientHeight-40){
        armed=false; armedAtTop=false;
        clearTimeout(armTimer);
        setHint('滑到底部，再往下滑一下进入下一条',false);
      }
    };
    _snOnTouchStart=function(e){ touchStart=e.touches[0].clientY; };
    _snOnTouchMove=function(e){
      if(!armed||!armedAtTop||!currentList.length) return;
      var dy=e.touches[0].clientY-touchStart;
      if(dy>0 && atBottom() && dy>52) goNext();
    };
    _snOnWheel=function(e){
      if(!currentList.length) return;
      if(atBottom() && e.deltaY>0 && armed && armedAtTop) goNext();
    };
    body.addEventListener('scroll',_snOnScroll,{passive:true});
    body.addEventListener('touchstart',_snOnTouchStart,{passive:true});
    body.addEventListener('touchmove',_snOnTouchMove,{passive:true});
    body.addEventListener('wheel',_snOnWheel,{passive:true});
  }
  function openDetail(d){
    if(!d) return;
    currentDetail=d;
    var c=color(d.region);
    document.getElementById('dName').textContent=d.name;
    document.getElementById('dTags').innerHTML='';

    var h='';
    // 诊断公式
    if(d.formula){
      h+='<section class="blk blk-formula" style="--rc:'+c+'">'+
         '<h3 class="blk-t"><span class="ic">🧮</span>诊断公式<span class="sub">看书先背式</span></h3>'+
         maskable('t-formula','<div class="formula-big" style="--rc:'+c+'">'+esc(d.formula)+'</div>')+
         '</section>';
    }
    // 相关图片（诊断公式下方）
    if(window.__FIGS_RENDER__ && (d.figs||[]).length){
      h += window.__FIGS_RENDER__(d.figs);
    }
    // 高特异性征象
    var spec=(d.specificSigns||[]);
    if(spec.length){
      h+='<section class="blk" style="--rc:'+c+'">'+
         '<h3 class="blk-t"><span class="ic">★</span>高特异性超声征象<span class="sub">考试最爱 · 优先背</span></h3>'+
         maskable('t-spec','<ul class="spec-list">'+spec.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul>')+
         '</section>';
    }
    // 下一条（滑到底后，需再下滑一次才跳；也可直接点击）
    if(currentList.length>1){
      var nx=currentList[(currentIdx+1)%currentList.length];
      h+='<div class="next-wrap"><div class="next-hint" id="nextHint">滑到底部，再往下滑一下进入下一条</div>'+
         '<button class="next-btn" id="nextCard" type="button">'+
           '<span class="nb-label">下一条</span>'+
           '<span class="nb-name">'+esc(nx.name)+'</span>'+
           '<span class="nb-arrow">→</span>'+
         '</button></div>';
    }
    document.getElementById('dBody').innerHTML=h;

    // 抽屉内训练遮罩点击
    [].forEach.call(document.getElementById('dBody').querySelectorAll('.t-hide'),function(el){
      el.addEventListener('click',function(){ if(state.training) el.classList.add('revealed'); });
    });
    // 图片：记录当前卡片图组 + 绑定加载态与点击放大
    if(window.__FIGS_BIND__ && (d.figs||[]).length){
      window.__FIGS_CURRENT__ = d.figs;
      window.__FIGS_BIND__(document.getElementById('dBody'));
    }
    // 下一条按钮
    var nb=document.getElementById('nextCard');
    if(nb) nb.onclick=function(){ goNext(); };
    bindScrollNext();

    document.getElementById('mask').classList.add('show');
    document.getElementById('drawer').classList.add('show');
    document.body.style.overflow='hidden';
  }
  function closeDetail(){
    currentDetail=null;
    var b=document.getElementById('dBody');
    if(b){ b.onscroll=null; }
    clearTimeout(armTimer);
    currentList=[]; currentIdx=-1; armed=false; armedAtTop=false;
    document.getElementById('mask').classList.remove('show');
    document.getElementById('drawer').classList.remove('show');
    document.body.style.overflow='';
  }
  document.getElementById('dClose').onclick=closeDetail;
  document.getElementById('mask').onclick=closeDetail;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDetail(); });

  // ---- 搜索 ----
  var qTimer=null;
  document.getElementById('q').addEventListener('input',function(e){
    clearTimeout(qTimer);
    var v=e.target.value;
    qTimer=setTimeout(function(){ state.q=v.trim(); render(); },140);
  });

  // ---- 返回顶部 ----
  var toTop=document.getElementById('toTop');
  window.addEventListener('scroll',function(){
    toTop.classList.toggle('show', window.scrollY>500);
  },{passive:true});
  toTop.onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };

  // ---- 初始化 ----
  function bootCards(){
    state.training = lsGet('us_train')==='1';
    applyFs();
    applyTraining();
    renderRegionChips();
    renderGroupChips();
    render();
  }
  bootCards();
})();
</script>
<script>
/* ================= 封面交互 ================= */
(function(){
  "use strict";
  var el = document.getElementById('splash');
  if(!el) return;

  // 每次打开都显示封面（不记忆），符合“第一页”的定位
  document.body.classList.add('splash-open');
  // 让封面可接收键盘事件（Enter / 空格 / Esc 也能进入）
  try{ el.focus({preventScroll:true}); }catch(e){}
  window.addEventListener('keydown', function(e){
    if(closed) return;
    if(e.key==='Enter'||e.key===' '||e.key==='Escape'){ e.preventDefault(); close(); }
  });

  var closed = false;
  function close(ev){
    if(closed) return;
    closed = true;
    // 点击位置涟漪
    try{
      if(ev && ev.clientX!=null){
        var r=document.createElement('span');
        r.className='splash-ripple';
        r.style.left=ev.clientX+'px'; r.style.top=ev.clientY+'px';
        r.style.width=r.style.height='220vmax';
        el.appendChild(r);
      }
    }catch(e){}
    el.classList.add('gone');
    document.body.classList.remove('splash-open');
    setTimeout(function(){ el.hidden = true; }, 520);
    try{ sessionStorage.setItem('us_splash_seen','1'); }catch(e){}
  }

  el.addEventListener('click', close);
  // 触摸滑动（上滑）也可进入
  var ty=0;
  el.addEventListener('touchstart',function(e){ ty=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',function(e){
    var dy=ty-(e.changedTouches[0].clientY||ty);
    if(dy>40) close(e.changedTouches[0]);
  },{passive:true});
})();
</script>
<!-- ===== 图片放大查看器 ===== -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="图片查看">
  <div class="lb-stage">
    <div class="lb-count" id="lbCount"></div>
    <div class="lb-tools">
      <button class="lb-btn" id="lbClose" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="lb-imgwrap" id="lbWrap"><img id="lbImg" alt=""></div>
    <div class="lb-cap" id="lbCap"></div>
    <button class="lb-nav prev" id="lbPrev" type="button" aria-label="上一张">‹</button>
    <button class="lb-nav next" id="lbNext" type="button" aria-label="下一张">›</button>
    <div class="lb-hint">滚轮/双指缩放 · 双击放大 · ← → 切换 · Esc 关闭</div>
  </div>
</div>

<script>window.__IMGBLOB__={};</script>
<script>
/* ================= 图组渲染 + 图片放大 ================= */
(function(){
  "use strict";
  var IMG_FALLBACK = "";
  // 图片索引 → dataURL（内嵌版把大图放在 __IMGBLOB__，避免拖慢首屏 JSON 解析）
  function resolveImg(s){
    if(typeof s==="string" && s.charAt(0)==="§"){
      var k=s.slice(1);
      if(window.__IMGBLOB__GET__) return window.__IMGBLOB__GET__(k);   // 惰性解析 JSON 片
      var b=window.__IMGBLOB__;
      var v=(b && b[k]) || "";
      if(v && v.indexOf("data:")!==0) v="data:image/webp;base64,"+v;
      return v;
    }
    return s;
  }

  /* ---------- 图组 HTML（插在诊断公式下方） ---------- */
  window.__FIGS_RENDER__ = function(figs){
    if(!figs || !figs.length) return "";
    var h = '<section class="figs">';
    h += '<h3 class="figs-head"><span class="ic">🖼</span>相关图片<span class="sub">点图放大</span></h3>';
    figs.forEach(function(f,gi){
      var n = f.imgs.length;
      var cls = "figgrid n" + Math.min(n,4);
      h += '<div class="figgroup">';
      h += '<div class="'+cls+'">';
      f.imgs.forEach(function(src,ii){
        src = resolveImg(src);
        h += '<button class="figitem" type="button" data-g="'+gi+'" data-i="'+ii+'" aria-label="放大查看">'+
               '<span class="ph">加载中…</span>'+
               '<img loading="lazy" decoding="async" src="'+src+'" alt="">'+
             '</button>';
      });
      h += '</div>';
      var leg = (f.legend||"").trim();
      var det = (f.detail||"").trim();
      if(leg || det){
        h += '<div class="figlegend"><span class="fig-no">图'+f.fig+'</span><b>'+escHtml(leg)+'</b>';
        if(det) h += '<span class="fig-detail">'+escHtml(det)+'</span>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += '</section>';
    return h;
  };

  function escHtml(s){
    return String(s==null?"":s).replace(/[&<>"]/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  /* ---------- 图片加载态 ---------- */
  window.__FIGS_BIND__ = function(root){
    var imgs = root.querySelectorAll(".figitem img");
    [].forEach.call(imgs,function(im){
      if(im.complete && im.naturalWidth>0){ im.classList.add("loaded"); var ph=im.parentNode.querySelector(".ph"); if(ph)ph.remove(); return; }
      im.addEventListener("load",function(){ im.classList.add("loaded"); var ph=im.parentNode.querySelector(".ph"); if(ph)ph.remove(); });
      im.addEventListener("error",function(){
        var ph=im.parentNode.querySelector(".ph"); if(ph) ph.textContent="图片加载失败";
        im.style.display="none";
      });
    });
    // 点击放大（用事件委托，避免重复绑定）
    if(!root.__figClickBound){
      root.__figClickBound=true;
      root.addEventListener("click",function(e){
        var btn=e.target.closest?e.target.closest(".figitem"):null;
        if(!btn) return;
        e.preventDefault(); e.stopPropagation();
        var g=+btn.dataset.g, i=+btn.dataset.i;
        var src=btn.querySelector("img").getAttribute("src");
        openLightbox(window.__FIGS_CURRENT__, g, i);
      },true);
    }
  };

  /* ---------- Lightbox ---------- */
  var lb,lbImg,lbCap,lbCount,lbPrev,lbNext,lbWrap;
  var state={figs:[],g:0,i:0,scale:1};

  function flat(){ // 拉平成单一序列
    var arr=[];
    state.figs.forEach(function(f,gi){ f.imgs.forEach(function(s,ii){ arr.push({src:resolveImg(s),fig:f.fig,legend:f.legend,detail:f.detail,g:gi,i:ii}); }); });
    return arr;
  }
  function idxOf(g,i){ var a=flat(); for(var k=0;k<a.length;k++){ if(a[k].g===g&&a[k].i===i) return k; } return 0; }

  function show(k){
    var a=flat(); if(!a.length) return;
    k=(k+a.length)%a.length;
    var cur=a[k];
    state.g=cur.g; state.i=cur.i; state.scale=1;
    lbImg.style.transform="";
    lbImg.src=cur.src;
    lbImg.onload=function(){ /* 自适应尺寸交给 CSS */ };
    var cap="";
    if(cur.legend) cap+='<span class="fig-no">图'+cur.fig+'</span>'+escHtml(cur.legend);
    if(cur.detail) cap+='<span class="d">'+escHtml(cur.detail)+'</span>';
    lbCap.innerHTML=cap;
    lbCap.style.display=cap?"":"none";
    lbCount.textContent=(k+1)+" / "+a.length;
    var multi=a.length>1;
    lbPrev.style.display=multi?"grid":"none";
    lbNext.style.display=multi?"grid":"none";
  }
  function openLightbox(figs,g,i){
    if(!figs||!figs.length) return;
    state.figs=figs;
    lb.hidden=false;
    requestAnimationFrame(function(){ lb.classList.add("show"); });
    show(idxOf(g,i));
    document.body.style.overflow="hidden";
  }
  function closeLightbox(){
    lb.classList.remove("show");
    document.body.style.overflow="";
    setTimeout(function(){ lb.hidden=true; lbImg.src=""; }, 240);
  }

  window.__FIGS_CURRENT__=null;   // 由主程序注入当前卡片的 figs

  function init(){
    lb=document.getElementById("lb");
    if(!lb) return;
    lbImg=document.getElementById("lbImg");
    lbCap=document.getElementById("lbCap");
    lbCount=document.getElementById("lbCount");
    lbPrev=document.getElementById("lbPrev");
    lbNext=document.getElementById("lbNext");
    lbWrap=document.getElementById("lbWrap");

    document.getElementById("lbClose").onclick=closeLightbox;
    lbPrev.onclick=function(e){ e.stopPropagation(); show(idxOf(state.g,state.i)-1); };
    lbNext.onclick=function(e){ e.stopPropagation(); show(idxOf(state.g,state.i)+1); };
    lb.addEventListener("click",function(e){ if(e.target===lb) closeLightbox(); });
    document.addEventListener("keydown",function(e){
      if(lb.hidden) return;
      if(e.key==="Escape") closeLightbox();
      else if(e.key==="ArrowLeft") show(idxOf(state.g,state.i)-1);
      else if(e.key==="ArrowRight") show(idxOf(state.g,state.i)+1);
    });
    // 滚轮缩放
    lbWrap.addEventListener("wheel",function(e){
      e.preventDefault();
      state.scale=Math.min(4,Math.max(0.6,state.scale+(e.deltaY<0?0.2:-0.2)));
      lbImg.style.transform="scale("+state.scale+")";
    },{passive:false});
    // 双击缩放
    lbWrap.addEventListener("dblclick",function(){
      state.scale=(state.scale>1.01)?1:2;
      lbImg.style.transform="scale("+state.scale+")";
    });
    // 触摸：单指拖动平移 / 双指缩放
    var tx=0,ty=0,dist=0,baseScale=1,panX=0,panY=0;
    lbWrap.addEventListener("touchstart",function(e){
      if(e.touches.length===1){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }
      else if(e.touches.length===2){ dist=tDist(e); baseScale=state.scale; }
    },{passive:true});
    lbWrap.addEventListener("touchmove",function(e){
      if(e.touches.length===1&&state.scale>1.01){
        var dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty;
        panX+=dx; panY+=dy; tx=e.touches[0].clientX; ty=e.touches[0].clientY;
        lbImg.style.transform="translate("+panX+"px,"+panY+"px) scale("+state.scale+")";
      } else if(e.touches.length===2&&dist){
        var s=baseScale*(tDist(e)/dist);
        state.scale=Math.min(4,Math.max(0.6,s));
        lbImg.style.transform="scale("+state.scale+")";
      }
    },{passive:true});
    lbWrap.addEventListener('touchend',function(){ dist=0; },{passive:true});
    function tDist(e){ var a=e.touches[0],b=e.touches[1]; return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
